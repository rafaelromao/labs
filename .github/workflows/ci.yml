name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Reference solutions pass
        working-directory: solutions/java
        run: ./gradlew test --console=plain
      - name: Starter tests pass with the reference swapped in
        run: scripts/verify-starters.sh java

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: solutions/go/go.mod
      - name: Reference solutions pass
        working-directory: solutions/go
        run: go test -race -count=1 ./...
      - name: Starter tests pass with the reference swapped in
        run: scripts/verify-starters.sh go
